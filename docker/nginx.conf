server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next's static export emits extensionless routes as `<route>.html`.
    location / {
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }
}
